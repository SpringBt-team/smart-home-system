services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у файлі .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthome} -d ${POSTGRES_DB:-smarthome}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    image: smarthome-server:latest
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smarthome}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-smarthome}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET у файлі .env}
    volumes:
      - applogs:/app/logs

volumes:
  pgdata:
  applogs:
